baseURL = "https://dersavage.github.io/cs/"
title = "Computer Science"
theme = "contour"
defaultContentLanguage = "en"
locale = "en-US"
enableRobotsTXT = true

[taxonomies]
  tag = "tags"
  category = "categories"

[markup.goldmark.renderer]
  # post bodies may contain hand-written HTML
  unsafe = true

[outputs]
  home = ["HTML", "RSS"]

[params]
  mainSections = ["posts"]
  logoName = "Computer"
  logoTLD = " Science"
  author = "Jan M. Savage"
  description = "Here you will find all sorts of things for all levels. For now the focus is on beginner and intermediate."

[[menus.main]]
  name = "Blog"
  pageRef = "/posts"
  weight = 10

[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 20

[[menus.main]]
  name = "Main site"
  url = "https://dersavage.github.io/site/"
  weight = 30
